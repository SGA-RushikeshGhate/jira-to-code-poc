# Declarative Automation Bundle for the Jira-to-Code promotion demo.
# The same code is deployed to every environment; only target settings differ.
# Workspace host/credentials come from DATABRICKS_HOST / DATABRICKS_TOKEN env vars in CI.
bundle:
  name: jira_to_code_demo

variables:
  catalog:
    description: Unity Catalog catalog the sample job writes to
    default: aura2
  schema:
    description: Schema the sample job writes to
    default: default

resources:
  jobs:
    sample_etl_job:
      name: "[${bundle.target}] jira-to-code sample ETL"
      tasks:
        - task_key: sample_etl
          spark_python_task:
            python_file: ./src/sample_etl.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--env"
              - "${bundle.target}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: aura2      # change to your dev catalog
      schema: default

  uat:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: aura2      # change to your uat catalog
      schema: default

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: aura2      # change to your prod catalog
      schema: default
